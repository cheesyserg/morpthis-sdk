name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host runtime and samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test
        run: make test

  contract:
    name: ABI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Symbol list is sorted and unique
        run: |
          sort -c abi/morpthis-api-2.txt
          test "$(sort -u abi/morpthis-api-2.txt | wc -l)" = \
               "$(wc -l < abi/morpthis-api-2.txt)"
      - name: Shell syntax
        run: |
          sh -n toolchain/fetch.sh
          sh -n tools/check-exports.sh

  # The device build needs the pinned toolchain. Enable this job when the
  # tarball is published on a release:
